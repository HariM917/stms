<!-- Angular Users List Component Template -->

<div class="users-container">
  <h2>STMS Users</h2>
  
  <!-- Error message -->
  <div *ngIf="error" class="alert alert-danger">
    <p>{{ error }}</p>
    <button class="btn btn-danger" (click)="loadUsers()">Try Again</button>
  </div>
  
  <!-- Controls -->
  <div class="controls">
    <div class="search-box">
      <input 
        type="text" 
        class="form-control" 
        placeholder="Search users..." 
        [value]="searchTerm"
        (input)="onSearchChange($event)"
      >
    </div>
    <button class="btn btn-primary" [disabled]="loading" (click)="loadUsers()">
      <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      {{ loading ? 'Loading...' : 'Refresh' }}
    </button>
  </div>
  
  <!-- Loading indicator -->
  <div *ngIf="loading" class="text-center p-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-2">Loading users...</p>
  </div>
  
  <!-- No users found -->
  <div *ngIf="!loading && !error && filteredUsers.length === 0" class="no-results">
    <p>No users found</p>
  </div>
  
  <!-- Users table -->
  <div *ngIf="!loading && filteredUsers.length > 0" class="table-responsive">
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th (click)="sortBy('id')" [class.active]="sortColumn === 'id'">
            ID
            <i *ngIf="sortColumn === 'id'" 
               class="bi" 
               [ngClass]="sortDirection === 'asc' ? 'bi-arrow-up' : 'bi-arrow-down'"></i>
          </th>
          <th (click)="sortBy('name')" [class.active]="sortColumn === 'name'">
            Name
            <i *ngIf="sortColumn === 'name'" 
               class="bi" 
               [ngClass]="sortDirection === 'asc' ? 'bi-arrow-up' : 'bi-arrow-down'"></i>
          </th>
          <th (click)="sortBy('email')" [class.active]="sortColumn === 'email'">
            Email
            <i *ngIf="sortColumn === 'email'" 
               class="bi" 
               [ngClass]="sortDirection === 'asc' ? 'bi-arrow-up' : 'bi-arrow-down'"></i>
          </th>
          <th (click)="sortBy('role')" [class.active]="sortColumn === 'role'">
            Role
            <i *ngIf="sortColumn === 'role'" 
               class="bi" 
               [ngClass]="sortDirection === 'asc' ? 'bi-arrow-up' : 'bi-arrow-down'"></i>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of filteredUsers">
          <td>{{ user.id }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>
            <span class="role-badge" [ngClass]="user.role || 'user'">
              {{ user.role || 'user' }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <!-- User count -->
  <div *ngIf="!loading && !error && users.length > 0" class="user-count">
    Showing {{ filteredUsers.length }} of {{ users.length }} users
  </div>
</div>
