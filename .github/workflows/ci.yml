- name: Run Test Suite with Pytest
        working-directory: backend
        env:
          ENVIRONMENT: test
          DB_DRIVER: sqlite
          JWT_SECRET: ci-test-secret-at-least-32-chars-long!
          LOG_LEVEL: WARNING
          ALLOW_MOCK_MODELS: "true"
        run: |
          pytest --cov=app --cov-report=term-missing tests/