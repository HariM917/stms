# ==============================================================================
# STMS — Docker Compose (Full Stack with PostgreSQL & Redis)
# ==============================================================================
# Start:  docker compose up --build
# Stop:   docker compose down
# Reset:  docker compose down -v  (removes volume data)
# ==============================================================================

services:
  # ---- PostgreSQL Database ----
  db:
    image: postgres:16-alpine
    container_name: stms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${DB_DATABASE:-stms_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis (Distributed Cache & Rate Limiting) ----
  redis:
    image: redis:7-alpine
    container_name: stms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- STMS Backend API Server ----
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stms-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8001}:8001"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DB_DRIVER=postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres_secure_pass}
      - DB_DATABASE=${DB_DATABASE:-stms_db}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-not-for-prod-use-32-chars!}
      - API_PORT=8001
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5000,http://localhost:3000,http://localhost:8001}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/ai_models:/app/ai_models:ro
      - ./backend/snapshots:/app/snapshots
      - ./backend/logs:/app/logs

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
